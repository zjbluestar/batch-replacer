name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install pyinstaller python-docx openpyxl
      
      - run: pyinstaller --onefile --windowed -n "batch-replacer" batch_replacer.py
      
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/batch-replacer.exe
